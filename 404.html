<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UdharGuru</title></head>
<body style="font-family:sans-serif;text-align:center;padding:40px">
<h3>UdharGuru</h3>
<p><a id="go" href="https://udharguru.in">Home</a></p>
<script>
  var m = location.pathname.match(/^\/ref\/([A-Za-z0-9]+)/);
  if (m) {
    var code = m[1].toUpperCase();
    var url = 'https://play.google.com/store/apps/details?id=com.udharkhata.akhil&referrer=' +
              encodeURIComponent('ref=' + code);
    document.getElementById('go').href = url;
    document.getElementById('go').textContent = 'Play Store par jaayein';
    location.replace(url);
  }
</script></body></html>
